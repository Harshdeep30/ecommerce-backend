server.port=8084
spring.application.name=ai-service

spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.model=openai/gpt-oss-20b

spring.datasource.url=jdbc:mysql://localhost:3306/ai_service
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
jwt.secret=${JWT_SECRET}

product.service.base-url=http://localhost:8081
spring.ai.openai.chat.replay-reasoning-content=false